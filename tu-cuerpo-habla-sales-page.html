<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu Cuerpo Habla | Rebels & Queens</title>

    <style>
        :root {
            --cream: #f8f1e7;
            --peach: #eaac8b;
            --coral: #e56b6f;
            --berry: #b56576;
            --purple: #6d597a;
            --navy: #355070;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: var(--cream);
            color: var(--navy);
            line-height: 1.7;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 80px 30px;
        }

        .logo {
            width: 90px;
            display: block;
            margin-bottom: 20px;
        }

        .eyebrow {
            color: var(--berry);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: .9rem;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: .9;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--navy);
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--coral);
            margin-bottom: 25px;
        }

        .intro {
            max-width: 700px;
            font-size: 1.15rem;
            color: var(--purple);
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="rond logo zonder tekst.png"
             alt="Rebels & Queens logo"
             class="logo">

        <p class="eyebrow">
            SOFT REBELLION · 01
        </p>

        <h1>
            TU CUERPO HABLA
        </h1>

        <p class="subtitle">
            10 señales que merece la pena escuchar.
        </p>

        <p class="intro">
            Tu cuerpo lleva años intentando decirte algo.
            Quizá los cambios que notas no son una coincidencia.
            Quizá ha llegado el momento de dejar de luchar contra ellos y empezar a entenderlos.
        </p>

    </div>

</body>
</html>
