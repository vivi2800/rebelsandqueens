<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rebels & Queens</title>

<style>

.hero{
  min-height:100vh;

  display:grid;

  grid-template-columns:1fr 1fr;

  align-items:center;

  max-width:1400px;

  margin:auto;

  padding:60px;
}

.hero-left{
  max-width:600px;
}

.hero-right{

  position:relative;

  height:600px;
}

.eyebrow{
  color:#b56576;
  letter-spacing:4px;
  text-transform:uppercase;
}

h1{
  font-size:clamp(5rem,9vw,8rem);
  line-height:.85;
  color:#355070;
  margin:20px 0;
}

.subtitle{
  color:#e56b6f;
  font-size:1.8rem;
}

.intro{
  color:#6d597a;
  font-size:1.1rem;
  line-height:1.8;
}

.btn{

  display:inline-block;

  margin-top:30px;

  padding:16px 32px;

  background:#e56b6f;

  color:white;

  text-decoration:none;

  border-radius:999px;
}

.circle{

  width:420px;
  height:420px;

  border:3px solid #b56576;

  border-radius:50%;

  position:absolute;

  right:0;
  top:60px;
}

.blob{

  width:260px;
  height:320px;

  background:#eaac8b;

  border-radius:55% 45% 65% 35%;

  position:absolute;

  right:80px;
  top:120px;
}

.statement{

  position:absolute;

  top:180px;

  right:110px;

  font-size:2.3rem;

  line-height:1.1;

  color:#355070;

  font-weight:bold;
}
</style>

</head>

<body>

<div class="hero">

  <p class="eyebrow">
    Soft Rebellion
  </p>

  <h1>
    TU CUERPO<br>
    HABLA.
  </h1>

  <p class="subtitle">
    ¿Lo estás escuchando?
  </p>

  <p class="intro">
    Una nueva forma de entender tu energía,
    tu ciclo y los cambios que llegan con cada etapa de la vida.
  </p>

  <a href="#" class="btn">
    Descubrir
  </a>

</div>

</body>

</html>
