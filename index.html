<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rebels & Queens</title>

<style>

body{
  margin:0;
  background:#f8f1e7;
  color:#355070;
  font-family:Arial,sans-serif;
}

.hero{
  min-height:100vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:40px;
}

.eyebrow{
  color:#b56576;
  letter-spacing:4px;
  text-transform:uppercase;
}

h1{
  font-size:clamp(4rem,10vw,7rem);
  margin:20px 0;
}

.subtitle{
  color:#e56b6f;
  font-size:1.5rem;
  margin-bottom:20px;
}

.intro{
  max-width:600px;
  color:#6d597a;
  line-height:1.8;
}

.btn{
  display:inline-block;

  margin-top:30px;

  padding:16px 32px;

  background:#e56b6f;

  color:white;

  text-decoration:none;

  border-radius:999px;
}

</style>

</head>

<body>

<div class="hero">

  <p class="eyebrow">
    Soft Rebellion
  </p>

  <h1>
    TU CUERPO<br>
    HABLA.
  </h1>

  <p class="subtitle">
    ¿Lo estás escuchando?
  </p>

  <p class="intro">
    Una nueva forma de entender tu energía,
    tu ciclo y los cambios que llegan con cada etapa de la vida.
  </p>

  <a href="#" class="btn">
    Descubrir
  </a>

</div>

</body>

</html>
