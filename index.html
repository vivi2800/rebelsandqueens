<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rebels & Queens</title>

<style>

body{
  margin:0;
  background:#f8f1e7;
  color:#355070;
  font-family:Georgia, serif;
}

.hero{

  min-height:100vh;

  max-width:900px;

  margin:auto;

  display:flex;

  flex-direction:column;

  justify-content:center;

  padding:60px 40px;
}

.eyebrow{

  color:#b56576;

  font-size:.9rem;

  letter-spacing:5px;

  text-transform:uppercase;

  margin-bottom:40px;
}

h1{

  color:#355070;

  font-size:clamp(4rem,12vw,8rem);

  line-height:.85;

  margin:0;
}

.subtitle{

  margin-top:30px;

  color:#e56b6f;

  font-size:clamp(1.3rem,3vw,2rem);
}

.intro{

  margin-top:30px;

  max-width:500px;

  color:#6d597a;

  font-size:1.1rem;

  line-height:1.8;
}

.btn{

  display:inline-block;

  margin-top:40px;

  padding:14px 28px;

  width:fit-content;

  background:#e56b6f;

  color:white;

  text-decoration:none;

  border-radius:999px;

  font-family:Arial,sans-serif;

  font-weight:600;
}

.btn:hover{

  background:#b56576;
}

@media (max-width:768px){

.hero{
  padding:40px 25px;
}

}
</style>

</head>

<body>
<div class="hero">

  <p class="eyebrow">SOFT REBELLION</p>

  <h1>
    TU CUERPO<br>
    HABLA.
  </h1>

  <p class="subtitle">
    ¿Lo estás escuchando?
  </p>

  <p class="intro">
    Una nueva forma de entender tu energía,
    tu ciclo y los cambios que llegan con cada etapa de la vida.
  </p>

  <a href="#" class="btn">
    Descubrir
  </a>

</div>

</body>

</html>
